<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculadora</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div class="espacio-trabajo">
    <main class="calculadora">
      <div class="cabecera">
        <h1 class="titulo">Calculadora</h1>
        <div class="cabecera-acciones">
          <label class="visualmente-oculto" for="tema">Tema</label>
          <select class="tema" id="tema">
            <option value="grafito">Grafito</option>
            <option value="negro">Negro</option>
            <option value="blanco">Blanco</option>
            <option value="cian">Cian</option>
            <option value="rosa">Rosa</option>
            <option value="violeta">Violeta</option>
            <option value="verde">Verde</option>
            <option value="ambar">Ámbar</option>
          </select>
          <button type="button" class="modo-toggle" id="modo-toggle" aria-pressed="false" aria-controls="teclado-cientifico">Científica</button>
          <button type="button" class="historial-toggle" id="historial-toggle" aria-expanded="true" aria-controls="historial">Historial</button>
        </div>
      </div>

      <div class="pantalla">
        <div class="expresion" id="expresion" aria-hidden="true"></div>
        <output class="resultado" id="resultado" role="status" aria-live="polite" aria-atomic="true">0</output>
      </div>

      <div class="teclado" id="teclado">
        <button type="button" class="tecla accion doble" data-action="clear">AC</button>
        <button type="button" class="tecla accion" data-action="backspace" aria-label="Borrar último carácter">⌫</button>
        <button type="button" class="tecla operador" data-op="/" aria-label="Dividir">÷</button>

        <button type="button" class="tecla" data-digit="7">7</button>
        <button type="button" class="tecla" data-digit="8">8</button>
        <button type="button" class="tecla" data-digit="9">9</button>
        <button type="button" class="tecla operador" data-op="*" aria-label="Multiplicar">×</button>

        <button type="button" class="tecla" data-digit="4">4</button>
        <button type="button" class="tecla" data-digit="5">5</button>
        <button type="button" class="tecla" data-digit="6">6</button>
        <button type="button" class="tecla operador" data-op="-" aria-label="Restar">−</button>

        <button type="button" class="tecla" data-digit="1">1</button>
        <button type="button" class="tecla" data-digit="2">2</button>
        <button type="button" class="tecla" data-digit="3">3</button>
        <button type="button" class="tecla operador" data-op="+" aria-label="Sumar">+</button>

        <button type="button" class="tecla doble" data-digit="0">0</button>
        <button type="button" class="tecla" data-action="decimal" aria-label="Separador decimal">.</button>
        <button type="button" class="tecla igual" data-action="equals" aria-label="Igual">=</button>

        <!-- Último hijo del teclado: al conmutar no desplaza las teclas de
             arriba, y hereda la delegación de clics de #teclado. -->
        <div class="teclado-cientifico" id="teclado-cientifico" hidden>
          <button type="button" class="tecla cientifica" data-fn="raiz" aria-label="Raíz cuadrada">√</button>
          <button type="button" class="tecla cientifica" data-fn="cuadrado" aria-label="Elevar al cuadrado">x²</button>
          <button type="button" class="tecla cientifica operador" data-op="^" aria-label="Elevar a una potencia">xʸ</button>
          <button type="button" class="tecla cientifica" data-fn="inverso" aria-label="Inverso">1/x</button>

          <button type="button" class="tecla cientifica" data-fn="ln" aria-label="Logaritmo natural">ln</button>
          <button type="button" class="tecla cientifica" data-fn="log" aria-label="Logaritmo decimal">log</button>
          <button type="button" class="tecla cientifica" data-constante="pi" aria-label="Pi">π</button>
          <button type="button" class="tecla cientifica" data-constante="e" aria-label="Número e">e</button>

          <button type="button" class="tecla cientifica" data-fn="sin" aria-label="Seno en grados">sin</button>
          <button type="button" class="tecla cientifica" data-fn="cos" aria-label="Coseno en grados">cos</button>
          <button type="button" class="tecla cientifica" data-fn="tan" aria-label="Tangente en grados">tan</button>
        </div>
      </div>
    </main>

    <aside class="historial" id="historial">
      <div class="historial-cabecera">
        <h2 class="historial-titulo">Historial</h2>
        <button type="button" class="historial-limpiar" id="limpiar-historial">Limpiar historial</button>
      </div>
      <p class="historial-vacio" id="historial-vacio">Todavía no hay operaciones.</p>
      <ul class="historial-lista" id="historial-lista" tabindex="0" aria-label="Operaciones recientes"></ul>
    </aside>
  </div>
</body>
</html>
